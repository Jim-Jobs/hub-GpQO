    - data:
        code: "import json\nimport re\n\ndef main(llm_output: str) -> dict:\n    queries\
          \ = []\n    try:\n        data = json.loads(llm_output)\n        if isinstance(data,\
          \ dict):\n            queries = data.get(\"queries\", [])\n        elif\
          \ isinstance(data, list):\n            queries = data\n    except Exception:\n\
          \        pass\n    if not queries:\n        m = re.search(r'\\{.*\\}', llm_output,\
          \ re.DOTALL)\n        if m:\n            try:\n                data = json.loads(m.group(0))\n\
          \                if isinstance(data, dict):\n                    queries\
          \ = data.get(\"queries\", [])\n            except Exception:\n         \
          \       pass\n    if not queries:\n        m = re.search(r'\\[.*\\]', llm_output,\
          \ re.DOTALL)\n        if m:\n            try:\n                arr = json.loads(m.group(0))\n\
          \                if isinstance(arr, list):\n                    queries\
          \ = arr\n            except Exception:\n                pass\n    if isinstance(queries,\
          \ str):\n        queries = [queries]\n    queries = [q.strip() for q in\
          \ queries if isinstance(q, str) and q.strip()]\n    return {\"queries\"\
          : queries}\n"
        code_language: python3
        outputs:
          queries:
            children: null
            type: array[string]
