            要求：

            1. 从不同角度（背景、现状、技术方案、应用场景、风险挑战等）拆解；

            2. 每个子问题都是可直接送入搜索引擎的查询语句，避免笼统或含糊；

            3. 子问题之间尽量互相独立，避免重复。


            用户的研究主题：{{#start.question#}}


            只输出一个 JSON 对象，格式如下，不要输出任何其他内容：

            {"queries": ["子问题1", "子问题2", "子问题3"]}

            '
        selected: false
