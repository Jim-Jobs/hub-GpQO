    - data:
        code: "import json\n\ndef main(body: str) -> dict:\n    try:\n        data\
          \ = json.loads(body)\n    except Exception:\n        return {\"context\"\
          : \"未能解析搜索结果\"}\n    pages = data.get(\"data\", {}).get(\"webPages\", {}).get(\"\
          value\", [])\n    if not isinstance(pages, list):\n        return {\"context\"\
          : \"未检索到相关内容\"}\n    parts = []\n    for i, p in enumerate(pages[:5], 1):\n\
          \        title = p.get(\"name\", \"\")\n        url = p.get(\"url\", \"\"\
          )\n        summary = p.get(\"summary\") or p.get(\"snippet\", \"\")\n  \
          \      parts.append(\"[{}] {}\\n链接: {}\\n内容: {}\".format(i, title, url,\
          \ summary))\n    return {\"context\": \"\\n\\n\".join(parts) if parts else\
          \ \"未检索到相关内容\"}\n"
