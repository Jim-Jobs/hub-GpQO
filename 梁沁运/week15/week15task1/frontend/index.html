<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情感陪伴 AI（多引擎版）</title>
  <style>
    /* ---------- 全局 ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 50%, #ecfeff 100%);
      color: #1f2937;
    }

    /* ---------- 卡片 ---------- */
    .card {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 32px 32px;
      box-shadow: 0 18px 48px rgba(79, 70, 229, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(99, 102, 241, 0.08);
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      color: #6b7280;
    }

    /* ---------- 表单 ---------- */
    .field {
      margin-top: 26px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: #111827;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .select:focus {
      border-color: #818cf8;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.16);
    }

    .textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.65;
      font-family: inherit;
      color: #111827;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .textarea::placeholder {
      color: #9ca3af;
    }

    .textarea:focus {
      border-color: #818cf8;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.16);
    }

    .send-btn {
      margin-top: 18px;
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.28);
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(99, 102, 241, 0.35);
    }

    .send-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .send-btn:disabled {
      opacity: 0.62;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---------- 结果区 ---------- */
    .result {
      display: none;
      margin-top: 28px;
      padding: 20px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #eef2f7;
      animation: fade-in 0.28s ease;
    }

    .result.visible {
      display: block;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .result-head-title {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.4px;
    }

    .sentiment-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
    }

    .sentiment-badge.positive {
      color: #047857;
      background: #d1fae5;
    }

    .sentiment-badge.negative {
      color: #b45309;
      background: #fef3c7;
    }

    .response-text {
      font-size: 15px;
      line-height: 1.8;
      color: #1f2937;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ---------- 错误提示 ---------- */
    .error {
      display: none;
      margin-top: 20px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      animation: fade-in 0.28s ease;
      word-break: break-word;
    }

    .error.visible {
      display: block;
    }

    /* ---------- 小屏适配 ---------- */
    @media (max-width: 480px) {
      .card {
        padding: 28px 20px 24px;
        border-radius: 16px;
      }
      .title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">情感陪伴 AI（多引擎版）</h1>
    <p class="subtitle">选择底层引擎，倾诉此刻的心情</p>

    <!-- 引擎选择 -->
    <div class="field">
      <label class="field-label" for="engine">底层引擎</label>
      <select id="engine" class="select">
        <option value="langgraph">LangGraph 引擎（8000 端口）</option>
        <option value="agents">OpenAI-Agents 引擎（8001 端口）</option>
      </select>
    </div>

    <!-- 输入区 -->
    <div class="field">
      <label class="field-label" for="user-input">想说的话</label>
      <textarea
        id="user-input"
        class="textarea"
        placeholder="在这里写下你此刻的心情，比如：今天面试通过了，特别开心！"
      ></textarea>
    </div>

    <button id="send-btn" class="send-btn" type="button">发送</button>

    <!-- 结果区 -->
    <section id="result" class="result" aria-live="polite">
      <div class="result-head">
        <span class="result-head-title">情感倾向</span>
        <span id="sentiment" class="sentiment-badge"></span>
      </div>
      <p id="response" class="response-text"></p>
    </section>

    <!-- 错误提示 -->
    <div id="error" class="error" role="alert"></div>
  </main>

  <script>
    // ---------------------------------------------------------------------
    // 要素引用
    // ---------------------------------------------------------------------
    const engineSelect = document.getElementById('engine');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const resultBox = document.getElementById('result');
    const sentimentEl = document.getElementById('sentiment');
    const responseEl = document.getElementById('response');
    const errorEl = document.getElementById('error');

    // 下拉选项 -> 后端地址（LangGraph: 8000，OpenAI-Agents: 8001）
    const ENDPOINTS = {
      langgraph: 'http://127.0.0.1:8000/chat',
      agents: 'http://127.0.0.1:8001/chat',
    };

    // 情感标签的中文文案与样式
    const SENTIMENT_META = {
      positive: { label: '积极 · positive', className: 'positive' },
      negative: { label: '消极 · negative', className: 'negative' },
    };

    // ---------------------------------------------------------------------
    // 界面状态辅助
    // ---------------------------------------------------------------------
    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      sendBtn.textContent = isLoading ? '正在思考...' : '发送';
    }

    function hideMessages() {
      resultBox.classList.remove('visible');
      errorEl.classList.remove('visible');
      errorEl.textContent = '';
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    }

    function renderResult(data) {
      // 情感倾向
      const meta = SENTIMENT_META[data.sentiment] || {
        label: data.sentiment,
        className: '',
      };
      sentimentEl.textContent = meta.label;
      sentimentEl.className = 'sentiment-badge ' + meta.className;

      // AI 回复（textContent 防止 XSS；CSS 的 pre-wrap 保留换行）
      responseEl.textContent = data.response || '';

      resultBox.classList.add('visible');
    }

    // ---------------------------------------------------------------------
    // 发送逻辑
    // ---------------------------------------------------------------------
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) {
        hideMessages();
        showError('请先输入想要倾诉的内容。');
        userInput.focus();
        return;
      }

      const endpoint = ENDPOINTS[engineSelect.value] || ENDPOINTS.langgraph;

      hideMessages();
      setLoading(true);

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ user_input: text }),
        });

        if (!res.ok) {
          // 后端统一返回 {"detail": "..."}，尽量把真实原因展示出来
          let detail = `请求失败（HTTP ${res.status}）`;
          try {
            const errBody = await res.json();
            if (errBody && errBody.detail) {
              detail += '：' + errBody.detail;
            }
          } catch (_) {
            /* 响应体不是 JSON 时忽略 */
          }
          throw new Error(detail);
        }

        const data = await res.json();
        renderResult(data);
      } catch (err) {
        // fetch 抛出的网络错误（比如后端没启动）
        const msg =
          err instanceof TypeError
            ? '无法连接到后端服务，请确认对应端口的服务已经启动。'
            : err.message;
        showError(msg);
      } finally {
        setLoading(false);
      }
    }

    // ---------------------------------------------------------------------
    // 事件绑定
    // ---------------------------------------------------------------------
    sendBtn.addEventListener('click', sendMessage);

    // Ctrl + Enter（macOS 下 Cmd + Enter）快捷发送
    userInput.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && !sendBtn.disabled) {
        sendMessage();
      }
    });
  </script>
</body>
</html>
