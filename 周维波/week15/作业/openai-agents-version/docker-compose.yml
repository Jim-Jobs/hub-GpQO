# 本地/单机部署：docker compose up -d --build
services:
  sentiment-agents:
    build:
      context: .
      args:
        # 国内构建建议走阿里云 PyPI 镜像；海外可直接留空
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    image: sentiment-agents:1.0.0
    container_name: sentiment-agents
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
