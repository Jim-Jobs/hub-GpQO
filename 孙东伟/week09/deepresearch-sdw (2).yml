    - data:
        code: "import json\n\ndef main(bocha_result: str) -> dict:\n    # 博查返回的是 JSON\
          \ 字符串，先解析\n    try:\n        data = json.loads(bocha_result)\n    except\
          \ (json.JSONDecodeError, TypeError):\n        return {\"text\": \"\"}\n\n\
          \    # 从 webPages.value 数组里提取标题和摘要\n    pages = data.get(\"webPages\", {}).get(\"\
          value\", [])\n    texts = []\n    for p in pages:\n        title = p.get(\"\
          name\", \"\")\n        summary = p.get(\"summary\", \"\")\n        if title\
          \ or summary:\n            texts.append(f\"标题：{title}\\n摘要：{summary}\")\n\
          \n    return {\"text\": \"\\n\\n\".join(texts)}"
        code_language: python3
