[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinook-sql-agent"
version = "0.1.0"
description = "Observable seven-stage SQLite question-answering workflow and evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chinook-agent = "sql_agent.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["sql_agent*"]
