# week15 作业二 · 前端容器 nginx：静态资源 + /api 反代网关（compose 服务名解析）
# SSE 关键：proxy_buffering off —— 不缓冲 chunked 响应，token 到达即下发，
# 否则打字机效果退化成"憋几秒整段刷出"。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
